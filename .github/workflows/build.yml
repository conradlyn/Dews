name: Build installers

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - "local/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    name: Windows installer (NSIS + MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Ensure VBScript for MSI packaging
        shell: pwsh
        continue-on-error: true
        run: |
          $feature = Get-WindowsOptionalFeature -Online -ErrorAction SilentlyContinue |
            Where-Object { $_.FeatureName -match 'VBScript' } | Select-Object -First 1
          if ($feature) {
            if ($feature.State -ne 'Enabled') {
              Enable-WindowsOptionalFeature -Online -FeatureName $feature.FeatureName -NoRestart | Out-Null
            }
          } else {
            dism /online /add-capability /capabilityname:VBSCRIPT~~~~ /norestart
          }

      - name: Build installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles nsis,msi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: dews-windows-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

  windows-portable:
    name: Windows portable (zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build app (no installer bundle)
        run: npm run tauri build -- --no-bundle

      - name: Assemble portable zip
        shell: pwsh
        run: |
          $stage = "portable-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "src-tauri/target/release/dews.exe" -Destination "$stage\Dews.exe"
          $zip = "Dews_1.1.3_portable.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force
          Write-Host "Created $zip"

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: dews-windows-portable
          path: Dews_*_portable.zip
          if-no-files-found: error

  macos-dmg:
    name: macOS dmg (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build app bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles app

      - name: Create dmg with hdiutil
        run: |
          APP="src-tauri/target/release/bundle/macos/Dews.app"
          DMG="src-tauri/target/release/bundle/dmg/Dews_1.1.3_aarch64.dmg"
          mkdir -p "$(dirname "$DMG")"
          hdiutil create -volname "Dews" -srcfolder "$APP" -ov -format UDZO "$DMG"
          hdiutil verify "$DMG"

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: dews-macos-dmg
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-installer, windows-portable, macos-dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Re-publishing the same version (e.g. after a rename) must not leave the
      # previous asset names behind: the release is recreated from scratch.
      # GH_REPO is required because this job never checks out the repository,
      # and a failed delete must fail the run — otherwise the upload below dies
      # with "asset already exists" and leaves a half-old release behind.
      - name: Drop previous release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release delete "${GITHUB_REF_NAME}" --yes
            echo "deleted the previous release for ${GITHUB_REF_NAME}"
          else
            echo "no previous release for ${GITHUB_REF_NAME}"
          fi

      # The updater reads this manifest from the `latest` release alias. It must
      # list the signed archive for each platform plus the signature itself.
      - name: Build updater manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, glob, json, os, pathlib

          tag = os.environ["GITHUB_REF_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          app_sig = glob.glob("artifacts/**/*.app.tar.gz.sig", recursive=True)[0]
          win_sig = glob.glob("artifacts/**/*-setup.exe.sig", recursive=True)[0]
          base = f"https://github.com/{repo}/releases/download/{tag}"

          def read(path):
              return pathlib.Path(path).read_text().strip()

          manifest = {
              "version": tag.lstrip("v"),
              "notes": "",
              "pub_date": datetime.datetime.now(datetime.timezone.utc)
                  .replace(microsecond=0)
                  .isoformat()
                  .replace("+00:00", "Z"),
              "platforms": {
                  "darwin-aarch64": {
                      "signature": read(app_sig),
                      "url": f"{base}/{pathlib.Path(app_sig).name[:-4]}",
                  },
                  "windows-x86_64": {
                      "signature": read(win_sig),
                      "url": f"{base}/{pathlib.Path(win_sig).name[:-4]}",
                  },
              },
          }
          pathlib.Path("latest.json").write_text(json.dumps(manifest, indent=2))
          print(pathlib.Path("latest.json").read_text())
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.msi
            artifacts/**/*-setup.exe
            artifacts/**/*-setup.exe.sig
            artifacts/**/*_portable.zip
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
            artifacts/**/*.app.tar.gz.sig
            latest.json
          generate_release_notes: true
