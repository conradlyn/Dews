[package]
name = "dews"
version = "1.1.1"
description = "Dews — 桌面 RSS 阅读器"
authors = ["conradlyn"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dews_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Enable for production builds so the embedded frontend is used instead of devUrl.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- data layer (ported from the WPF edition) ---
quick-xml = "0.31"
html-escape = "0.2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "deflate", "native-tls", "http2"] }
encoding_rs = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
# The tray icon is a Windows-only affordance; keeping the feature target-scoped
# avoids compiling tray-icon into the macOS bundle, where the Dock icon already
# serves as the way back to a hidden window.
tauri = { version = "2", features = ["tray-icon"] }
windows-sys = { version = "0.52", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Registry"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
# Keep CI builds fast on both windows-latest and macos-latest. Full LTO with
# one codegen unit forced a slow single-threaded rebuild of every dependency.
codegen-units = 16
lto = false
opt-level = 2
panic = "abort"
strip = true
